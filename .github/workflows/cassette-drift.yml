name: Cassette Drift Monitor
# WS9: nightly re-record of the live sandbox scenario, sanitized in memory and
# shape-diffed against the committed cassette (key sets, statuses, body
# schemas — never volatile values). Drift fails this monitor loudly, naming the
# exact interaction keys. Report-only: committed cassettes are never rewritten,
# raw captures never leave the runner's temp directory, and this workflow is
# never a PR gate.

on:
  schedule:
    - cron: '30 8 * * *'   # daily at 8:30 AM UTC, after contract-smoke
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preflight:
    name: Drift credential preflight
    runs-on: ubuntu-latest
    outputs:
      recordable: ${{ steps.credentials.outputs.recordable }}
    steps:
      - id: credentials
        name: Check sandbox recording secret
        env:
          SMOKE_NON_ORG_API_KEY: ${{ secrets.SMOKE_NON_ORG_API_KEY }}
        run: |
          set -euo pipefail
          recordable=true
          if [ -z "$SMOKE_NON_ORG_API_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::notice::Skipping cassette drift check: SMOKE_NON_ORG_API_KEY is not configured."
              recordable=false
            else
              echo "::error::Cannot run cassette drift check: SMOKE_NON_ORG_API_KEY is not configured."
              exit 1
            fi
          fi
          echo "recordable=$recordable" >> "$GITHUB_OUTPUT"

  drift-check:
    name: Shape-diff live re-recording vs committed cassette
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.recordable == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Re-record fresh-onboard and shape-diff against the committed cassette
        env:
          POSTMAN_E2E_API_KEY_NON_ORG_MODE: ${{ secrets.SMOKE_NON_ORG_API_KEY }}
        run: npm run drift:check
