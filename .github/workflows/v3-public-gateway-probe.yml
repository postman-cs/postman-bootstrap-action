name: V3 Public Gateway Probe
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: Run v3-public-gateway-probe
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          POSTMAN_API_KEY: ${{ secrets.COLLECTION_V3_API_KEY }}
          COLLECTION_V3_WORKSPACE_ID: ${{ vars.COLLECTION_V3_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$POSTMAN_API_KEY" ]; then
            echo "::error::COLLECTION_V3_API_KEY secret is not configured (beta/stage-minted key, not a production PMAK)."
            exit 1
          fi
          if [ -z "$COLLECTION_V3_WORKSPACE_ID" ]; then
            echo "::error::COLLECTION_V3_WORKSPACE_ID var is not configured."
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run probe against stage
        env:
          POSTMAN_API_KEY: ${{ secrets.COLLECTION_V3_API_KEY }}
          COLLECTION_V3_WORKSPACE_ID: ${{ vars.COLLECTION_V3_WORKSPACE_ID }}
          COLLECTION_V3_HOST: https://api.getpostman-stage.com
        run: node --experimental-strip-types scripts/v3-public-gateway-probe.ts
