name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - cs-beta-actions_20260305

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  normalize-receipt:
    name: Normalize multifile receipt
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    outputs:
      updated: ${{ steps.rebind.outputs.updated }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Plan receipt normalization
        id: rebind
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/rebind-multifile-receipt.mjs --write
      - name: Prefetch vendored dependencies
        if: steps.rebind.outputs.updated == 'true'
        env:
          DEPS_REPO: ${{ secrets.DEPS_REPO }}
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: node .github/scripts/prefetch-vendored-deps.mjs
      - name: Rebuild and validate normalized receipt
        if: steps.rebind.outputs.updated == 'true'
        run: |
          npm ci
          npm run bundle
          git add validation/evidence/multifile-spec-sync.json dist/action.cjs dist/cli.cjs dist/index.cjs
          changed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' dist/action.cjs dist/cli.cjs dist/index.cjs validation/evidence/multifile-spec-sync.json | LC_ALL=C sort)"
          if [ "$changed" != "$expected" ]; then
            echo "::error::Receipt normalization changed files outside its exact allowlist"
            printf 'changed:\n%s\n' "$changed"
            exit 1
          fi
          npx vitest run tests/ci-receipt-rebind.test.ts tests/multifile-spec-sync-receipt.test.ts
          npm run verify:dist:assert
      - name: Commit normalized receipt and dispatch fresh checks
        if: steps.rebind.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: rebind multifile receipt to source"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          gh workflow run ci.yml --ref "$GITHUB_HEAD_REF"
          gh workflow run sea-binary.yml --ref "$GITHUB_HEAD_REF"

  gate:
    needs: normalize-receipt
    if: ${{ always() && (needs.normalize-receipt.result == 'success' || needs.normalize-receipt.result == 'skipped') && needs.normalize-receipt.outputs.updated != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so commitlint can lint the PR commit range.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Prefetch vendored dependencies
        env:
          DEPS_REPO: ${{ secrets.DEPS_REPO }}
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: node .github/scripts/prefetch-vendored-deps.mjs
      - run: npm ci
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh
      - run: postman --version
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/393031adb9afb225ee52ae2ccd7a5af5525e03e8/scripts/download-actionlint.bash) 1.7.11 "$RUNNER_TEMP"
          echo "ACTIONLINT_BIN=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"
      # Bundle once before fan-out so tests and the read-only dist gate have
      # immutable artifacts. Typecheck runs exactly once in the gate below.
      - run: npm run bundle
      # Keep at most two checks active on the two-vCPU runner. Every gate reports;
      # failures aggregate under ::group:: logs so one pass shows every result.
      - name: Run gates
        run: |
          set -uo pipefail
          declare -A pid=()
          declare -A result=()
          declare -a names=()
          MAX_PARALLEL_GATES=2
          finish_one() {
            local finished_pid status n
            if wait -n -p finished_pid "${pid[@]}"; then status=0; else status=$?; fi
            for n in "${!pid[@]}"; do
              if [ "${pid[$n]}" = "$finished_pid" ]; then
                result[$n]=$status
                unset 'pid[$n]'
                return
              fi
            done
          }
          run() {
            while [ "${#pid[@]}" -ge "$MAX_PARALLEL_GATES" ]; do finish_one; done
            local n=$1; shift
            names+=("$n")
            ( "$@" ) >"$RUNNER_TEMP/$n.log" 2>&1 & pid[$n]=$!
          }

          run lint       npm run lint
          run test       npm test
          run routes     npm run verify:route-manifest
          run typecheck  npm run typecheck
          run dist-shape npm run verify:dist:shape
          run integ      npm run test:integration
          run actionlint "$ACTIONLINT_BIN"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run commitlint npx commitlint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}"
          fi

          while [ "${#pid[@]}" -gt 0 ]; do finish_one; done
          fail=0
          for n in "${names[@]}"; do
            if [ "${result[$n]}" -eq 0 ]; then echo "gate:$n=pass"; else echo "gate:$n=fail"; fail=1; fi
          done
          for n in "${names[@]}"; do
            echo "::group::$n"; cat "$RUNNER_TEMP/$n.log"; echo "::endgroup::"
          done
          exit $fail
      - name: Ensure clean tracked tree outside dist
        run: |
          set -euo pipefail
          outside=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            file="${line:3}"
            case "$file" in
              dist/*) ;;
              validation/evidence/multifile-spec-sync.json) ;;
              *) outside+=("$file") ;;
            esac
          done < <(git status --porcelain)
          if [ "${#outside[@]}" -gt 0 ]; then
            echo "Unexpected changes outside dist/:"
            printf '%s\n' "${outside[@]}"
            exit 1
          fi
      - name: Write dist manifest
        run: |
          node <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const lock = readFileSync('package-lock.json');
          writeFileSync(
            'dist-manifest.json',
            `${JSON.stringify(
              {
                repository: process.env.GITHUB_REPOSITORY,
                pull_request: Number(process.env.GITHUB_EVENT_PULL_REQUEST_NUMBER || 0),
                head_sha: process.env.GITHUB_EVENT_NAME === "pull_request" ? JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")).pull_request.head.sha : process.env.GITHUB_SHA,
                lock_hash: createHash('sha256').update(lock).digest('hex'),
              },
              null,
              2,
            )}\n`,
          );
          NODE
        env:
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
      - name: Upload candidate dist
        uses: actions/upload-artifact@v7
        with:
          name: candidate-dist
          path: |
            dist/
            dist-manifest.json

  dist-parity:
    needs: gate
    if: ${{ always() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Prefetch vendored dependencies
        env:
          DEPS_REPO: ${{ secrets.DEPS_REPO }}
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: node .github/scripts/prefetch-vendored-deps.mjs
      - run: npm ci
      - run: npm run bundle
      - run: npm run verify:dist:parity
      - name: Upload expected dist on mismatch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: expected-dist
          path: dist/

  windows:
    name: Windows gate
    needs: normalize-receipt
    if: ${{ always() && (needs.normalize-receipt.result == 'success' || needs.normalize-receipt.result == 'skipped') && needs.normalize-receipt.outputs.updated != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Receipt validation and integration tests require source ancestry.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Cache node_modules
        id: windows-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-Windows-Node-24-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ hashFiles('package-lock.json') }}
      - name: Prefetch vendored dependencies
        if: steps.windows-node-modules.outputs.cache-hit != 'true'
        env:
          DEPS_REPO: ${{ secrets.DEPS_REPO }}
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: node .github/scripts/prefetch-vendored-deps.mjs
      - name: Install dependencies
        if: steps.windows-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Resolve Postman CLI version
        id: postman-cli-version
        shell: pwsh
        run: |
          $raw = npm view postman-cli version --json
          if ($LASTEXITCODE -ne 0) {
            throw "npm view postman-cli version failed with exit $LASTEXITCODE"
          }
          $version = $raw | ConvertFrom-Json
          if ($version -isnot [string] -or $version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            throw "Expected a single strict semver-like postman-cli version, got: $raw"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Cache Postman CLI
        id: windows-postman-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\postman-cli
          key: postman-cli-${{ steps.postman-cli-version.outputs.version }}-Windows-${{ runner.arch }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}
      - name: Install Postman CLI
        if: steps.windows-postman-cli.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          npm install "postman-cli@${{ steps.postman-cli-version.outputs.version }}" --prefix "${{ runner.temp }}\postman-cli" --no-save --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Add Postman CLI to PATH
        shell: pwsh
        run: |
          $exe = Join-Path "${{ runner.temp }}\postman-cli" 'node_modules\@postman\pm-bin-windows-x64\bin\postman.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Expected versioned Postman CLI executable at $exe"
          }
          $dir = Split-Path -Parent $exe
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run gates
        shell: pwsh
        run: |
          $gates = @(
            'test|||node|||--run|||test'
            'integ|||node|||--run|||test:integration'
          ) | ConvertTo-Json -Compress
          node .github/scripts/run-windows-gates.mjs --gate-json $gates
          exit $LASTEXITCODE

  ready:
    needs: [gate, dist-parity, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs succeeded
        run: |
          echo "gate=${{ needs.gate.result }}"
          echo "dist-parity=${{ needs.dist-parity.result }}"
          echo "windows=${{ needs.windows.result }}"
          for result in "${{ needs.gate.result }}" "${{ needs.dist-parity.result }}" "${{ needs.windows.result }}"; do
            if [ "$result" != "success" ]; then
              echo "CI not ready: one or more required jobs did not succeed"
              exit 1
            fi
          done
          echo "CI ready"
