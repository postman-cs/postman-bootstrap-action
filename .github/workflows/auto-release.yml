name: Auto Release

# Cuts releases automatically from main.
#
# The tag is an OUTPUT of a passing run, never an input to one. release.yml
# still triggers on `push: tags`, but nothing hand-pushes those tags any more:
# this workflow creates a tag only after the exact bytes of the release commit
# pass the full gate set. A failed cut therefore leaves no tag and burns no
# version number, and the next merge to main retries the cut on a fresh one.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One cut at a time. Never cancel a cut in flight: it holds an unpushed tag.
concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cut:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      # The cut opens a pull request to carry the normalized receipt back to
      # main, which pushes cannot reach directly.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the version selector reads every tag ever
          # cut so it can skip burnt versions instead of reusing them.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh
      - run: postman --version

      - name: Plan release
        id: plan
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.json
        run: |
          set -euo pipefail
          # Write the plan outside the worktree: the cut refuses to run from a
          # dirty tree, so a stray artifact here would block every release.
          node scripts/release-cut.mjs --plan | tee "$PLAN_FILE"
          {
            echo "release=$(node -p "require(process.env.PLAN_FILE).release === true")"
            echo "version=$(node -p "require(process.env.PLAN_FILE).version || ''")"
          } >> "$GITHUB_OUTPUT"

      - name: Cut release
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release-cut.mjs --execute

      - name: Push release tag
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          # Push the tag only. main requires pull requests, and the release
          # commit does not belong there: it carries just the version bump,
          # rebuilt dist, and the normalized receipt, all of which release.yml
          # reads from the tagged commit. main keeps advancing through PRs and
          # the next cut branches from wherever it then points.
          git push origin "refs/tags/v${VERSION}"

      - name: Start or recover release workflow
        id: release_target
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_FILE: ${{ runner.temp }}/plan.json
        run: |
          set -euo pipefail
          RELEASE="$(node -p "require(process.env.PLAN_FILE).release === true")"
          if [ "$RELEASE" = true ]; then
            TAG="v$(node -p "require(process.env.PLAN_FILE).version")"
          else
            TAG="$(node -p "require(process.env.PLAN_FILE).previous || ''")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "::notice::No release tag is available to dispatch."
            exit 0
          fi
          if [ "$RELEASE" != true ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; no recovery dispatch needed."
            exit 0
          fi
          # GITHUB_TOKEN tag pushes do not trigger workflows. On a rerun with
          # no new cut, retry the latest tag when its GitHub release is absent.
          gh workflow run release.yml --ref "$TAG"

      - name: Open receipt normalization pull request
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          # The release is already dispatched, so a branch or PR API failure
          # here cannot strand the immutable tag unpublished.
          if git diff --quiet "origin/${GITHUB_REF_NAME}" -- validation/evidence/multifile-spec-sync.json; then
            echo "::notice::Receipt already matches ${GITHUB_REF_NAME}; no normalization PR needed."
            exit 0
          fi
          BRANCH="chore/normalize-receipt-v${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          PR_URL="$(gh pr list --state open --base "${GITHUB_REF_NAME}" --head "$BRANCH" --json url --jq '.[0].url')"
          if [ -z "$PR_URL" ]; then
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "chore: normalize multifile receipt after v${VERSION}" \
              --body "Carries the receipt binding and rebuilt \`dist/\` from the v${VERSION} cut back onto ${GITHUB_REF_NAME}, where the receipt contract test reads them. Opened automatically by auto-release.yml."
          fi
          # GITHUB_TOKEN-created pull requests do not emit pull_request runs.
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run sea-binary.yml --ref "$BRANCH"

      - name: Report skipped cut
        if: steps.plan.outputs.release != 'true'
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.json
        run: |
          set -euo pipefail
          echo "::notice::No release cut. $(node -p "require(process.env.PLAN_FILE).reason || 'no plan reason'")"
